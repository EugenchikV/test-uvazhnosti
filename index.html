<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Знайди 5 відмінностей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: невинна казуальна гра для телефону — тепла, мила, нічого не віщує
   IDEA: дитяча книжка-головоломка «знайди відмінності» з журнального кіоску
   PICTURE: два фото, одне під одним, на другому 5 змін
   COLOUR and TYPE: глибокий озерний синій фон, жовтий акцент, Rubik
   LAYOUT: заголовок + лічильник, дві картинки на всю ширину, підказка знизу */
:root{color-scheme:light dark;--bg:#0f3d5c;--card:#fff8e8;--ink:#fff;--acc:#ffc93c;--ok:#2fd27a}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0,#1b6390,var(--bg) 70%);color:var(--ink);font:16px/1.45 Rubik,system-ui,sans-serif;overflow-x:clip;user-select:none;-webkit-user-select:none}
.wrap{max-width:560px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 14px 24px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
h1{font-size:24px;line-height:1.05;margin:0;font-weight:800;text-wrap:balance}
.cnt{flex:none;background:var(--acc);color:#3a2600;font-weight:800;border-radius:999px;padding:8px 14px;font-size:17px}
.timer{height:8px;border-radius:9px;background:#ffffff22;overflow:hidden;margin:0 0 12px}
.timer i{display:block;height:100%;width:100%;background:var(--acc);transition:width 1s linear}
.pic{position:relative;background:var(--card);border-radius:16px;padding:6px;margin-bottom:10px;box-shadow:0 8px 24px #0005}
.pic svg{display:block;width:100%;height:auto;border-radius:11px;cursor:pointer;transition:transform 6s ease-in}
.zoom .pic svg{transform:scale(1.06)}
.lbl{position:absolute;top:12px;left:14px;background:#0008;color:#fff;font-size:13px;padding:2px 9px;border-radius:9px;pointer-events:none}
.hint{text-align:center;font-size:16px;color:#d8ecff;min-height:24px;margin:4px 0 0}
.hint b{color:var(--acc)}
.miss{animation:miss .3s}
@keyframes miss{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.ring{fill:none;stroke:var(--ok);stroke-width:9;animation:pop .35s ease-out}
@keyframes pop{from{r:2;opacity:0}}
.x{stroke:#e33;stroke-width:9;stroke-linecap:round;animation:fade .7s forwards}
@keyframes fade{to{opacity:0}}
/* start screen */
.start{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:#0f3d5cf2;padding:24px;text-align:center}
.start h2{font-size:34px;line-height:1.05;margin:0 0 10px}
.start p{margin:0 0 22px;color:#d8ecff;max-width:30ch}
.btn{font:800 19px Rubik,sans-serif;background:var(--acc);color:#3a2600;border:0;border-radius:16px;padding:16px 34px;min-height:52px;cursor:pointer;box-shadow:0 6px 0 #c4901a}
.btn:active{transform:translateY(3px);box-shadow:0 3px 0 #c4901a}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
/* screamer */
.scr{position:fixed;inset:0;z-index:9;background:#000;display:none;place-items:center;overflow:hidden}
.scr.on{display:grid}
.scr .face{width:120vmax;height:120vmax;max-width:none;animation:lunge .18s cubic-bezier(.2,2,.4,1) forwards,shake .09s .18s 30 linear}
.scr img,.scr video{width:100%;height:100%;object-fit:cover;object-position:72% 45%;animation:lunge .18s cubic-bezier(.2,2,.4,1) forwards,shake .09s .18s 30 linear}
@keyframes lunge{from{transform:scale(.25)}to{transform:scale(1)}}
@keyframes shake{0%{transform:translate(0,0) scale(1.02)}25%{transform:translate(-14px,9px) scale(1.04)}50%{transform:translate(11px,-12px) scale(1.02)}75%{transform:translate(-9px,-7px) scale(1.05)}}
.got{position:fixed;inset:0;z-index:10;display:none;place-items:center;text-align:center;background:#0f3d5c;padding:24px}
.got.on{display:grid}
.got h2{font-size:44px;line-height:1.05;margin:0 0 8px}
.got p{color:#d8ecff;margin:0 0 22px}
@media(prefers-reduced-motion:reduce){.scr .face,.scr img,.scr video{animation:none}.pic svg{transition:none}}
</style>
</head>
<body>
<div class="wrap" id="game">
  <header><h1>Знайди 5 відмінностей</h1><div class="cnt" id="cnt">0 / 5</div></header>
  <div class="timer"><i id="bar"></i></div>
  <div class="pic"><span class="lbl">Картинка 1</span><svg id="A" viewBox="0 0 900 700"></svg></div>
  <div class="pic"><span class="lbl">Картинка 2</span><svg id="B" viewBox="0 0 900 700"></svg></div>
  <p class="hint" id="hint">Тапай по відмінностях на будь-якій картинці</p>
</div>

<div class="start" id="start">
  <div>
    <h2>Знайди 5 відмінностей</h2>
    <p>Тест на уважність: 90% людей не знаходять останню. Маєш 60 секунд.</p>
    <button class="btn" id="go">Грати</button>
  </div>
</div>

function wav(sec,fn,rate=22050){
  const n=Math.floor(sec*rate),buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){let s=Math.max(-1,Math.min(1,fn(i/rate)));v.setInt16(44+i*2,s*32767,true)}
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}

const chime=new Audio(chimeUrl);chime.preload='auto';
function unlock(a){try{a.muted=true;const p=a.play();if(p)p.then(()=>{a.pause();a.currentTime=0;a.muted=false}).catch(()=>{a.muted=false})}catch(e){}}
function play(a){try{a.currentTime=0;a.muted=false;a.play().catch(()=>{})}catch(e){}}

// ---------- game ----------
const found=new Set();let armed=false,fired=false,tLeft=60,tick,trap;
function toSvg(svg,e){const r=svg.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*900,y:(e.clientY-r.top)/r.height*700}}
function mark(i){for(const b of [0,1]){const g=$('marks'+b),d=DIFFS[i];g.insertAdjacentHTML('beforeend',`<circle class="ring" cx="${d.x}" cy="${d.y}" r="${d.r}"/>`)}}
function miss(svg,p){const g=svg.querySelector('[id^=marks]');const id='x'+Date.now();
  g.insertAdjacentHTML('beforeend',`<g class="x" id="${id}"><path d="M${p.x-18} ${p.y-18}L${p.x+18} ${p.y+18}M${p.x+18} ${p.y-18}L${p.x-18} ${p.y+18}"/></g>`);
  setTimeout(()=>{const el=document.getElementById(id);if(el)el.remove()},800);
  svg.parentNode.classList.remove('miss');void svg.parentNode.offsetWidth;svg.parentNode.classList.add('miss');}
function onTap(e){
  if(fired)return;const svg=e.currentTarget,p=toSvg(svg,e);
  const i=DIFFS.findIndex((d,k)=>!found.has(k)&&Math.hypot(d.x-p.x,d.y-p.y)<d.r);
  if(i<0){miss(svg,p);return}
  if(armed){boo();return} // знайшов останню раніше за таймер — тим краще
  found.add(i);mark(i);play(chime);$('cnt').textContent=found.size+' / 5';
  if(found.size===4)arm();
}
function arm(){
  armed=true;
  // людина вдивляється в останню відмінність — скрімер через 5–8 с
  $('hint').innerHTML='Залишилась <b>одна</b>! Придивись дуже уважно…';
  $('game').classList.add('zoom');
  trap=setTimeout(boo,5000+Math.random()*3000);
}
function boo(){
  if(fired)return;fired=true;clearTimeout(trap);clearInterval(tick);
  $('scr').classList.add('on');play(scream);
  try{navigator.vibrate&&navigator.vibrate([400,100,400,100,600])}catch(e){}
  setTimeout(()=>{$('scr').classList.remove('on');$('got').classList.add('on')},3200);
}
for(const s of [$('A'),$('B')])s.addEventListener('pointerdown',onTap);
$('go').addEventListener('click',()=>{
  unlock(scream);play(chime);$('start').remove();
  tick=setInterval(()=>{tLeft--;$('bar').style.width=Math.max(0,tLeft/60*100)+'%';if(tLeft<=0)boo()},1000);
});
$('again').addEventListener('click',()=>location.reload());
}
